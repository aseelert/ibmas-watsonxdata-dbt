site_name: watsonx.data · dbt · Spark Medallion Demo
site_description: A concise technical demo for dbt, Spark, Iceberg, and the medallion lakehouse on IBM watsonx.data.
repo_url: https://github.com/aseelert/ibmas-watsonxdata-dbt
repo_name: aseelert/ibmas-watsonxdata-dbt
theme:
  name: material
  favicon: assets/images/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.sections
    - navigation.top
    - navigation.tabs
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.highlight
    - search.suggest
extra_css:
  - assets/stylesheets/extra.css
plugins:
  # Listing plugins disables the implicit default, so search must be named here.
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
nav:
  - Demo flow:
    - Welcome: demo/index.md
    - "Access and URLs": demo/access.md
    - "1 · Prepare": demo/setup.md
    - "2 · dbt to Gold": demo/dbt.md
    - "3 · Metabase": demo/metabase.md
    - "4 · Spark and Confluent": demo/processing.md
    - "5 · Airflow": demo/airflow.md
    - "6 · Runtime Lineage": demo/lineage.md
    - "7 · Catalog and Governance": demo/catalog-governance.md
    - "Platform decision": demo/platform-choice.md
    - "Operations and validation": demo/operations.md
