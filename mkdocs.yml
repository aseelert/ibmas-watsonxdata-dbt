site_name: watsonx.data · dbt · Spark Medallion Demo
site_description: A concise technical demo for dbt, Spark, Iceberg, and the medallion lakehouse on IBM watsonx.data.
repo_url: https://github.com/aseelert/ibmas-watsonxdata-dbt
repo_name: aseelert/ibmas-watsonxdata-dbt
theme:
  name: material
  favicon: assets/images/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - toc.follow
    - content.code.copy
    - search.highlight
    - search.suggest
extra_css:
  - assets/stylesheets/extra.css
plugins:
  # Listing plugins disables the implicit default, so search must be named here.
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
nav:
  - Workshop:
    - Overview and outcomes: index.md
    - Lakehouse and medallion: demo/foundations.md
    - Delivery-path decision: demo/delivery-options.md
    - Baseline workshop: demo/setup.md
  - Ingest and transform:
    - Ingest to Bronze: demo/ingestion.md
    - Reference path — dbt and Presto: demo/dbt.md
    - Batch alternative — Spark: demo/spark.md
    - Event alternative — Kafka and Flink: demo/streaming.md
  - Consume and operate:
    - Serve Gold in Metabase: demo/metabase.md
    - Orchestrate with Airflow: demo/airflow.md
    - Validate and reconcile: demo/operations.md
  - Lineage and governance:
    - Lineage methods — dbt, OpenLineage, Marquez, Manta: demo/lineage.md
    - Catalog, quality, and governance: demo/catalog-governance.md
    - Open source and IBM platform: demo/platform-choice.md
  - Reference:
    - Access and interfaces: demo/access.md
    - Environment setup: demo/environment.md
